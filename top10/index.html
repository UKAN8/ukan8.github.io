<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="나의 인생게임 TOP10">
<meta property="og:description" content="1996~2018 신작을 넘기며 내 인생게임 TOP10을 지켜내세요">

<title>나의 인생게임 TOP10</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --desk:#008080; --win:#c0c0c0; --hi:#ffffff; --sh:#808080; --dk:#404040;
  --bar1:#000080; --bar2:#1084d0; --ink:#000; --sel:#000080; --selink:#fff;
  --paper:#fff; --mute:#5a5a5a; --gold:#ffe27a;
  --g-M:#6a4bd8; --g-A:#d8542b; --g-F:#2b7bd8; --g-C:#e3b214; --g-S:#2fa36b; --g-P:#c93d7c;
  --font:"Noto Sans KR",system-ui,sans-serif; --px:"Press Start 2P",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh;padding:12px 8px 64px}
.window{background:var(--win);max-width:640px;margin:0 auto;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset 1px 1px 0 var(--win),inset -1px -1px 0 var(--sh),4px 4px 0 rgba(0,0,0,.35)}
.tbar{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--bar1),var(--bar2));color:#fff;padding:4px 6px;font-weight:700;font-size:14px;margin:3px}
.tbar .ico{width:16px;height:16px;background:#fff;border:1px solid #000;display:inline-block;flex:none}
.tbar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .x{width:18px;height:16px;background:var(--win);color:#000;font-size:11px;line-height:14px;text-align:center;border:1px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);font-weight:700;cursor:pointer}
.body{padding:14px 12px 12px}
.year{font-family:var(--px);font-size:24px;letter-spacing:-1px;margin:0 0 2px}
.age{font-size:13px;color:var(--mute);margin:0 0 6px;min-height:20px}
.hint{font-size:12px;color:var(--mute);margin:0 0 12px}
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 4px}
@media(min-width:560px){.icons{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}
.gi{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:6px 2px;font:inherit;color:inherit;min-height:96px;justify-content:flex-start}
.pic{width:48px;height:48px;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);display:grid;place-items:center;font-family:var(--px);font-size:9px;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.5);position:relative;flex:none;overflow:visible;background:var(--sh)}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.gi .lab{font-size:13px;line-height:1.25;text-align:center;padding:1px 3px;border:1px dotted transparent;word-break:keep-all}
.gi.in .lab{background:var(--sel);color:var(--selink);border-color:#fff}
.gi.in .pic::after{content:"#" attr(data-r);position:absolute;right:-8px;bottom:-7px;height:16px;padding:0 4px;background:var(--gold);color:#000;border:1px solid #000;font:700 10px/14px var(--font)}
@media(hover:hover){.gi:hover .lab{border-color:var(--sh)}}
.gi:focus-visible .lab{border-color:#000}
.pic.M{background:var(--g-M)}.pic.A{background:var(--g-A)}.pic.F{background:var(--g-F)}.pic.C{background:var(--g-C)}.pic.S{background:var(--g-S)}.pic.P{background:var(--g-P)}
.empty{padding:28px 8px;text-align:center;color:var(--mute);border:1px dashed var(--sh);font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 10px;border-top:1px solid var(--hi);box-shadow:0 -1px 0 var(--sh);position:sticky;bottom:40px;background:var(--win);z-index:4}
.btn{font:inherit;font-size:15px;font-weight:500;padding:9px 12px;background:var(--win);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px 0 var(--sh);cursor:pointer;color:#000;flex:1;min-width:0}
.btn:active{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:none}
.btn.pri{outline:1px solid #000;outline-offset:-4px}
.btn.sm{flex:0 0 auto;padding:4px 10px;font-size:13px}
.cnt{font-size:12px;color:var(--mute);text-align:center;flex:0 0 auto;font-variant-numeric:tabular-nums}
.task{position:fixed;left:0;right:0;bottom:0;height:40px;background:var(--win);border-top:2px solid var(--hi);display:flex;align-items:center;gap:6px;padding:0 6px;z-index:5}
.start{font-weight:700;font-size:13px;padding:3px 8px;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);display:flex;align-items:center;gap:5px;background:var(--win);cursor:pointer;font-family:var(--font)}
.start i{width:14px;height:14px;background:linear-gradient(135deg,#f00 50%,#0a0 50%);display:inline-block}
.prog{flex:1;height:22px;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);display:flex;gap:2px;padding:2px;overflow:hidden}
.prog b{flex:1;background:var(--bar1);display:none;min-width:0}
.prog b.done{display:block}
.top{font-size:13px;font-weight:700;padding:3px 10px;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);background:var(--win);cursor:pointer;font-family:var(--font);white-space:nowrap;font-variant-numeric:tabular-nums}
.top.open{border-color:var(--dk) var(--hi) var(--hi) var(--dk);background:#d8d8d8}
/* intro */
.intro{padding:20px 14px 8px}
.intro h1{font-family:var(--px);font-size:15px;line-height:1.8;margin:0 0 14px;text-wrap:balance}
.intro p{margin:0 0 10px;max-width:60ch}
.intro small{color:var(--mute);display:block;margin-top:8px}
.field{display:flex;gap:8px;align-items:center;margin:14px 0 4px;flex-wrap:wrap}
.field input{font:inherit;font-size:16px;padding:5px 8px;width:110px;background:var(--paper);color:#000;-webkit-text-fill-color:#000;color-scheme:light;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px 0 #000}
/* rank window */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:560px){.ov{align-items:center;padding:20px}}
.rw{width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column}
.rw .list{background:var(--paper);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px 0 #000;margin:0 10px;overflow-y:auto;overscroll-behavior:contain;flex:1}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #e4e4e4;background:#fff;position:relative;touch-action:pan-y}
.row.drag{opacity:.35}
.row.ghost{position:fixed;left:0;right:0;z-index:30;box-shadow:0 4px 0 rgba(0,0,0,.35);border:1px solid #000;pointer-events:none;width:auto;margin:0 12px}
.row .rk{font-family:var(--px);font-size:11px;width:28px;text-align:right;color:var(--bar1);flex:none}
.row.r1 .rk,.row.r2 .rk,.row.r3 .rk{color:#b8860b}
.row .pic{width:32px;height:32px;font-size:7px}
.row .nm{flex:1;min-width:0;font-size:14px;line-height:1.2}
.row .nm small{display:block;color:var(--mute);font-size:11px}
.row .hd{width:36px;height:36px;display:grid;place-items:center;cursor:grab;color:var(--sh);font-size:18px;touch-action:none;user-select:none;flex:none}
.row .mv{display:flex;flex-direction:column;gap:2px;flex:none}
.row .mv button,.row .rm{font:inherit;font-size:11px;line-height:1;width:26px;height:16px;padding:0;background:var(--win);border:1px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);cursor:pointer;color:#000}
.row .rm{width:26px;height:34px;font-size:14px;flex:none}
.slot{padding:8px;color:var(--sh);font-size:13px;border-bottom:1px dashed #ddd;display:flex;gap:8px;align-items:center}
.slot .rk{font-family:var(--px);font-size:11px;width:28px;text-align:right;color:#bbb}
.rw .foot{position:static;padding:8px 10px 10px}
/* result */
.note{background:var(--paper);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px 0 #000;padding:14px;font-size:14px;overflow-x:auto}
.note h2{font-family:var(--px);font-size:13px;line-height:1.7;margin:0 0 6px;text-wrap:balance}
.note .sub{color:var(--mute);margin:0 0 14px;font-size:13px}
.champ{display:flex;gap:12px;align-items:center;border:2px solid var(--gold);background:#fff9dc;padding:10px;margin:0 0 12px}
.champ .pic{width:64px;height:64px;font-size:10px}
.champ .rk{font-family:var(--px);font-size:11px;color:#b8860b;margin-bottom:4px}
.champ .nm{font-weight:700;font-size:18px;line-height:1.2}
.champ small{color:var(--mute)}
.rl{margin:0 0 14px;padding:0;list-style:none}
.rl li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #eee;font-size:14px}
.rl .rk{font-family:var(--px);font-size:10px;width:26px;text-align:right;color:var(--bar1);flex:none}
.rl .pic{width:28px;height:28px;font-size:6px}
.rl small{color:var(--mute);margin-left:auto;font-size:12px;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.stat{border:1px solid var(--sh);padding:8px 10px}
.stat b{display:block;font-family:var(--px);font-size:12px;margin-bottom:4px}
.stat span{font-size:12px;color:var(--mute)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin:0 0 14px}
.bars .n{font-size:13px;white-space:nowrap}
.bars .tr{height:14px;border:1px solid var(--sh);padding:1px;background:#f0f0f0}
.bars .tr i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c) 0 6px,transparent 6px 8px)}
.bars .v{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.taste{border-left:4px solid var(--bar1);padding:6px 12px;margin:0 0 14px;background:#eef0f8}
.toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:#ffffe1;border:1px solid #000;padding:6px 12px;font-size:13px;box-shadow:2px 2px 0 rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:92vw;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;pointer-events:auto}
.toast button{font:inherit;font-size:12px;padding:2px 8px;background:var(--win);border:1px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);cursor:pointer}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
/* persistent TOP10 */
.strip{position:sticky;top:0;z-index:3;background:var(--win);border-bottom:1px solid var(--sh);box-shadow:0 1px 0 var(--hi);padding:6px 8px 4px}
.strip .st{font-size:11px;color:var(--mute);margin:0 0 4px;display:flex;justify-content:space-between}
.strip .st b{color:var(--bar1)}
.slots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.slots::-webkit-scrollbar{display:none}
.sl{flex:0 0 52px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;font:inherit;cursor:pointer;color:inherit}
.sl .pic{width:40px;height:40px;font-size:7px}
.sl.e .pic{background:#d8d8d8;border-style:dashed;border-color:var(--sh);color:var(--sh);font-size:12px}
.sl .rk{font-family:var(--px);font-size:8px;color:var(--bar1)}
.sl.r1 .rk,.sl.r2 .rk,.sl.r3 .rk{color:#b8860b}
.sl .nm{font-size:10px;line-height:1.1;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layout{display:block}
.side{display:none}
@media(min-width:760px){
  .window.wide{max-width:960px}
  .layout{display:grid;grid-template-columns:1fr 320px;align-items:start}
  .strip{display:none}
  .side{display:block;border-left:1px solid var(--sh);box-shadow:inset 1px 0 0 var(--hi);position:sticky;top:0;align-self:start;max-height:calc(100vh - 60px);overflow:auto}
  .side .list{background:var(--paper);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px 0 #000;margin:0 10px 10px}
  .side .hint{margin:8px 12px 6px}
}
</style>
</head>
<body>

</div>
<div class="toast" id="toast"></div>

let step=-1, birth=null, rank=[];
try{const s=JSON.parse(localStorage.getItem("mygames_top10")||"{}");rank=(s.rank||[]).filter(n=>GENRE[n]);birth=s.birth||null;}catch(e){}

const app=document.getElementById("app"),prog=document.getElementById("prog"),topbtn=document.getElementById("topbtn");

const esc=s=>s.replace(/"/g,"&quot;");

function shell(title,inner,foot){app.classList.remove("wide");app.innerHTML=`<div class="tbar"><span class="ico"></span><span class="t">${title}</span><span class="x">✕</span></div>${inner}${foot||""}`;window.scrollTo({top:0});}
function ageText(y){if(!birth)return"";const a=y-birth;if(a<0)return"태어나기 전";if(a<7)return`${a}살 · 아직 유치원`;if(a<13)return`${a}살 · 초${a-6}`;if(a<16)return`${a}살 · 중${a-12}`;if(a<19)return`${a}살 · 고${a-15}`;return`${a}살`;}
function updTop(){topbtn.textContent=`TOP10 · ${rank.length}`;}

function intro(){
  step=-1;bars.forEach(b=>b.classList.remove("done"));updTop();
  shell("나의 인생게임 TOP10 - 설치 마법사",`<div class="intro">
  <h1>1996년부터 2018년까지,<br>해마다 신작이 나옵니다.<br>내 TOP10을 지켜내세요.</h1>
  <p>한 해에 한 화면. 신작을 누르면 TOP10에 들어갑니다. 열 자리가 차면 새 게임은 10위로 들어오고 기존 10위가 밀려납니다. 순위는 TOP10 창에서 끌어서 바꾸고, 뺄 건 뺍니다.</p>
  <div class="field"><label for="b">출생연도(선택)</label><input id="b" type="number" inputmode="numeric" placeholder="예: 1994" min="1950" max="2020" value="${birth||""}"></div>
  <small>적으면 연도마다 '그때 몇 살·몇 학년'이 같이 표시됩니다. 저장은 이 기기 안에서만 됩니다.</small>
  </div>`,`<div class="foot"><span class="cnt">${DATA.length}개 연도 · ${Object.keys(GENRE).length}개 게임</span><button class="btn pri" id="go">${rank.length?"이어서 ▸":"시작 ▸"}</button></div>`);

function show(i){
  step=i;const [y,games]=DATA[i];
  bars.forEach((b,k)=>b.classList.toggle("done",k<i));updTop();

  const grid=games.length?`<p class="hint">누르면 TOP10에 올라갑니다. 다시 누르면 뺍니다.</p><div class="icons">${ordered.map(([n,g])=>{const r=rank.indexOf(n);return`<button class="gi${r>=0?" in":""}" data-n="${esc(n)}">${picHtml(n)}<span class="lab">${n}</span></button>`;}).join("")}</div>`
   :`<div class="empty">이 해엔 새로 나온 게임이 없었습니다.<br>다들 하던 걸 계속했거나, 게임 대신 뭔가를 했겠죠.</div>`;
  shell(`C:\\게임\\${y}`,`<div class="strip" id="strip"></div><div class="layout"><div class="body"><p class="year">${y}</p><p class="age">${ageText(y)}</p>${grid}</div><div class="side"><p class="hint">내 TOP10 — ≡ 를 끌어 순서 변경</p><div class="list" id="sl"></div></div></div>`,
   `<div class="foot"><button class="btn" id="prev">◂ 이전</button><span class="cnt">${i+1}/${DATA.length}</span><button class="btn pri" id="next">${i===DATA.length-1?"결과 보기":"다음 ▸"}</button></div>`);
  app.classList.add("wide");
  app.querySelectorAll(".gi").forEach(el=>el.onclick=()=>toggle(el.dataset.n));refreshGrid();renderRank();
  document.getElementById("prev").onclick=()=>i?show(i-1):intro();
  document.getElementById("next").onclick=()=>i<DATA.length-1?show(i+1):result();
}
function refreshGrid(){app.querySelectorAll(".gi").forEach(el=>{const r=rank.indexOf(el.dataset.n);el.classList.toggle("in",r>=0);const p=el.querySelector(".pic");if(p)p.dataset.r=r+1;});updTop();}
function toggle(n){
  const r=rank.indexOf(n);
  if(r>=0){rank.splice(r,1);save();renderRank();toast(`${n} 뺐습니다.`);return;}
  let out=null;
  if(rank.length>=N){out=rank.pop();}
  rank.push(n);save();renderRank();
  if(out)toast(`${n} #10 진입 · ${out} 탈락`,["되돌리기",()=>{rank.pop();rank.push(out);save();renderRank();toast(`${out} 복귀`);}]);
  else toast(`${n} → #${rank.length}`);
}

/* ---------- rank window ---------- */
let ov=null;
function openRank(){
  if(ov)return closeRank();
  ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="window rw"><div class="tbar"><span class="ico"></span><span class="t">인생게임 TOP10.lst</span><span class="x" id="rc">✕</span></div><p class="hint" style="margin:8px 12px 6px">≡ 를 끌어서 순서를 바꾸세요. ▲▼도 됩니다.</p><div class="list" id="rl"></div><div class="foot"><button class="btn pri" id="rc2">닫기</button></div></div>`;
  document.body.appendChild(ov);topbtn.classList.add("open");

function closeRank(){if(ov){ov.remove();ov=null;topbtn.classList.remove("open");if(step>=0&&step<DATA.length)refreshGrid();}}
function renderRank(){
  updTop();
  const strip=document.getElementById("strip");
  if(strip){strip.innerHTML=`<p class="st"><span>내 TOP10 <b>${rank.length}/10</b></span><span>탭하면 순서 편집</span></p><div class="slots">${Array.from({length:N},(_,i)=>{const n=rank[i];return n?`<button class="sl r${i+1}"><span class="rk">${i+1}</span>${picHtml(n)}<span class="nm">${n}</span></button>`:`<button class="sl e"><span class="rk">${i+1}</span><span class="pic">·</span><span class="nm">&nbsp;</span></button>`;}).join("")}</div>`;
    strip.querySelectorAll(".sl").forEach(b=>b.onclick=openRank);}
  if(step>=0&&step<DATA.length)refreshGrid();
  const targets=[ov&&ov.querySelector("#rl"),document.getElementById("sl")].filter(Boolean);
  targets.forEach(L=>renderList(L));
}
function renderList(L){
  L.innerHTML=rank.map((n,i)=>`<div class="row r${i+1}" data-i="${i}"><span class="rk">${i+1}</span>${picHtml(n)}<span class="nm">${n}<small>${GENRE[n].y} · ${G[GENRE[n].g][0]}</small></span><span class="mv"><button data-mv="-1" aria-label="위로">▲</button><button data-mv="1" aria-label="아래로">▼</button></span><button class="rm" aria-label="빼기">✕</button><span class="hd" aria-hidden="true">≡</span></div>`).join("")
   +Array.from({length:N-rank.length},(_,k)=>`<div class="slot"><span class="rk">${rank.length+k+1}</span>빈 자리</div>`).join("");
  L.querySelectorAll(".row").forEach(row=>{
    const i=+row.dataset.i;
    row.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const j=i+ +b.dataset.mv;if(j<0||j>=rank.length)return;[rank[i],rank[j]]=[rank[j],rank[i]];save();renderRank();});
    row.querySelector(".rm").onclick=()=>{const n=rank.splice(i,1)[0];save();renderRank();toast(`${n} 뺐습니다.`,["되돌리기",()=>{rank.splice(i,0,n);save();renderRank();}]);};
    row.querySelector(".hd").onpointerdown=e=>startDrag(e,row,i,L);
  });
}
function startDrag(e,row,from,L){
  e.preventDefault();
  const rows=()=>[...L.querySelectorAll(".row")];
  const ghost=row.cloneNode(true);ghost.classList.add("ghost");const rect=row.getBoundingClientRect();ghost.style.top=rect.top+"px";ghost.style.width=rect.width+"px";ghost.style.left=rect.left+"px";ghost.style.margin=0;document.body.appendChild(ghost);
  row.classList.add("drag");const offY=e.clientY-rect.top;let to=from;
  const move=ev=>{ghost.style.top=(ev.clientY-offY)+"px";
    const rs=rows();let idx=rs.findIndex(r=>{const b=r.getBoundingClientRect();return ev.clientY<b.top+b.height/2;});if(idx<0)idx=rs.length;
    if(idx>from)idx--;
    if(idx!==to){to=idx;const cur=rows();const dr=cur[from];const others=cur.filter(r=>r!==dr);L.insertBefore(dr,others[to]||L.querySelector(".slot"));}
    // autoscroll
    const lb=L.getBoundingClientRect();if(ev.clientY<lb.top+30)L.scrollTop-=8;else if(ev.clientY>lb.bottom-30)L.scrollTop+=8;};
  const up=()=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);ghost.remove();
    if(to!==from){const n=rank.splice(from,1)[0];rank.splice(to,0,n);save();}renderRank();};
  document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
}

/* ---------- result ---------- */
let RK=[],BT=null,SHARED=false;
function ageTextB(y){const s=birth;birth=BT;const r=ageText(y);birth=s;return r;}
const ALL=Object.keys(GENRE);
function resultUrl(){return location.origin+location.pathname+"?r="+RK.map(n=>ALL.indexOf(n)).join(".")+(BT?"&b="+BT:"");}
function result(rk,bt,shared){
  RK=rk||rank;BT=bt===undefined?birth:bt;SHARED=!!shared;
  step=DATA.length;bars.forEach(b=>b.classList.add("done"));updTop();
  if(!RK.length){shell("결과",`<div class="body"><div class="empty">TOP10이 비어 있습니다. 정말요?</div></div>`,`<div class="foot"><button class="btn" id="prev">◂ 돌아가기</button></div>`);document.getElementById("prev").onclick=()=>SHARED?intro():show(DATA.length-1);return;}
  const gc={M:0,A:0,F:0,C:0,S:0,P:0};const eraC=[0,0,0,0];
  RK.forEach((n,i)=>{const w=N-i;const {y,g}=GENRE[n];gc[g]+=w;ERA.forEach((e,k)=>{if(y>=e[0]&&y<=e[1])eraC[k]+=w});});
  const wsum=Object.values(gc).reduce((a,b)=>a+b,0);
  const top=Object.entries(gc).sort((a,b)=>b[1]-a[1]);const [tg,tn]=top[0];const second=top[1];
  const era=ERA[eraC.indexOf(Math.max(...eraC))];
  const ys=RK.map(n=>GENRE[n].y);const first=Math.min(...ys),last=Math.max(...ys);
  const c=RK[0];const title=`${era[2]}, ${G[tg][1]}`;
  const share=tn/wsum;
  let taste=share>=.6?`${G[tg][0]} 한 우물. 순위 가중치로 열에 ${Math.round(share*10)}이 ${G[tg][0]}입니다.`
    :second&&second[1]>0?`${G[tg][0]}이 먼저지만 ${G[second[0]][0]}도 상위권에 있습니다. ${G[second[0]][1]}의 얼굴도 있네요.`:`${G[tg][0]} 전문.`;
  const gap=last-first;
  taste+=gap>=15?` 1위부터 10위까지 ${gap}년에 걸쳐 있습니다. 한 시절에 머물지 않은 사람.`:gap<=6?` TOP10이 ${first}~${last} ${gap+1}년 안에 다 있습니다. 그 시절이 전성기였던 사람.`:"";
  const max=Math.max(...Object.values(gc));
  const barsHtml=`<div class="bars">${top.filter(([g,v])=>v).map(([g,v])=>`<span class="n">${G[g][0]}</span><span class="tr"><i style="--c:var(--g-${g});width:${v/max*100}%"></i></span><span class="v">${v}</span>`).join("")}</div>`;
  const lst=RK.slice(1).map((n,i)=>`<li><span class="rk">${i+2}</span>${picHtml(n)}<span>${n}</span><small>${GENRE[n].y}</small></li>`).join("");
  shell(SHARED?"친구의 명예의 전당.txt - 메모장":"명예의 전당.txt - 메모장",`<div class="body">${SHARED?'<p class="hint" style="margin:0 0 10px">친구가 보낸 TOP10입니다. 아래에서 내 것도 만들 수 있어요.</p>':''}<div class="note">
   <h2>${title}</h2><p class="sub">${era[0]}~${era[1]} 게임이 상위권 · 주력 ${G[tg][0]}</p>
   <div class="champ">${picHtml(c)}<div><div class="rk">#1 인생게임</div><div class="nm">${c}</div><small>${GENRE[c].y} · ${G[GENRE[c].g][0]}${BT?" · "+ageTextB(GENRE[c].y):""}</small></div></div>
   <ul class="rl">${lst}</ul>
   <div class="taste">${taste}</div>
   <div class="stats"><div class="stat"><b>${RK.length}/10</b><span>채운 자리</span></div><div class="stat"><b>${first}–${last}</b><span>TOP10이 걸친 시기</span></div></div>
   ${barsHtml}</div></div>`,
   SHARED?`<div class="foot"><button class="btn pri" id="mine">나도 만들기 ▸</button><button class="btn" id="img">이미지</button></div>`:`<div class="foot"><button class="btn" id="prev">◂ 수정</button><button class="btn" id="img">이미지 저장</button><button class="btn pri" id="sh">공유</button></div>`);
  const url=resultUrl();
  const text=`[나의 인생게임 TOP10]\n${title}\n\n`+RK.map((n,i)=>`${i+1}. ${n} (${GENRE[n].y})`).join("\n")+`\n\n${taste}\n\n내 TOP10 보기 → ${url}`;
  const o={title,era,tg,taste,url,text};
  if(SHARED){document.getElementById("mine").onclick=()=>{history.replaceState(null,"",location.pathname);intro();};}
  else{document.getElementById("prev").onclick=()=>show(DATA.length-1);
    document.getElementById("sh").onclick=async()=>{if(navigator.share){try{await navigator.share({title:"나의 인생게임 TOP10",text:o.text});return}catch(e){}}copy(o.text);};}
  document.getElementById("img").onclick=()=>showImage(o);
}

/* ---------- result image ---------- */
const GC={M:"#6a4bd8",A:"#d8542b",F:"#2b7bd8",C:"#e3b214",S:"#2fa36b",P:"#c93d7c"};
function bevel(x,X,y,w,h,inset){x.fillStyle=inset?"#808080":"#fff";x.fillRect(X,y,w,2);x.fillRect(X,y,2,h);x.fillStyle=inset?"#fff":"#404040";x.fillRect(X,y+h-2,w,2);x.fillRect(X+w-2,y,2,h);}
function wrap(x,t,maxW){const out=[];let line="";for(const ch of t){if(x.measureText(line+ch).width>maxW&&line){out.push(line);line=ch;}else line+=ch;}if(line)out.push(line);return out;}
async function makeImage(o){
  try{await document.fonts.load("bold 40px 'Noto Sans KR'");await document.fonts.load("20px 'Press Start 2P'");}catch(e){}
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const KR="'Noto Sans KR',sans-serif",PX="'Press Start 2P',monospace";
  x.fillStyle="#008080";x.fillRect(0,0,W,H);
  // window
  const wx=40,wy=60,ww=W-80,wh=H-120;x.fillStyle="#000";x.fillRect(wx+8,wy+8,ww,wh);x.fillStyle="#c0c0c0";x.fillRect(wx,wy,ww,wh);bevel(x,x,wx,wy,ww,wh,false);
  const g=x.createLinearGradient(wx,0,wx+ww,0);g.addColorStop(0,"#000080");g.addColorStop(1,"#1084d0");x.fillStyle=g;x.fillRect(wx+8,wy+8,ww-16,52);
  x.fillStyle="#fff";x.fillRect(wx+20,wy+22,24,24);x.fillStyle="#000";x.strokeRect(wx+20.5,wy+22.5,24,24);
  x.fillStyle="#fff";x.font=`bold 28px ${KR}`;x.textBaseline="middle";x.fillText("명예의 전당.txt - 메모장",wx+58,wy+34);
  x.fillStyle="#c0c0c0";x.fillRect(wx+ww-52,wy+18,32,30);bevel(x,x,wx+ww-52,wy+18,32,30,false);x.fillStyle="#000";x.font=`bold 20px ${KR}`;x.textAlign="center";x.fillText("✕",wx+ww-36,wy+33);x.textAlign="left";
  // paper
  const px=wx+24,py=wy+84,pw=ww-48,ph=wh-108;x.fillStyle="#fff";x.fillRect(px,py,pw,ph);bevel(x,x,px,py,pw,ph,true);
  let y=py+56;const lx=px+40,cw=pw-80;
  x.fillStyle="#000";x.font=`22px ${PX}`;x.textBaseline="alphabetic";
  for(const ln of wrap(x,o.title,cw)){x.fillText(ln,lx,y);y+=40;}
  x.fillStyle="#5a5a5a";x.font=`24px ${KR}`;y+=8;x.fillText(`${o.era[0]}~${o.era[1]} 게임이 상위권 · 주력 ${G[o.tg][0]}`,lx,y);y+=36;
  // champion
  const c1=RK[0];x.fillStyle="#fff9dc";x.fillRect(lx,y,cw,140);x.strokeStyle="#ffe27a";x.lineWidth=4;x.strokeRect(lx+2,y+2,cw-4,136);
  x.fillStyle=GC[GENRE[c1].g];x.fillRect(lx+22,y+22,96,96);bevel(x,x,lx+22,y+22,96,96,false);x.fillStyle="#fff";x.font=`16px ${PX}`;x.textAlign="center";x.fillText(ABBR[GENRE[c1].g],lx+70,y+78);x.textAlign="left";
  x.fillStyle="#b8860b";x.font=`16px ${PX}`;x.fillText("#1 인생게임",lx+140,y+48);
  x.fillStyle="#000";x.font=`bold 44px ${KR}`;x.fillText(c1,lx+140,y+98);

  y+=170;
  // 2-10
  x.font=`28px ${KR}`;
  RK.slice(1).forEach((n,i)=>{x.fillStyle="#000080";x.font=`16px ${PX}`;x.textAlign="right";x.fillText(String(i+2),lx+44,y+30);x.textAlign="left";
    x.fillStyle=GC[GENRE[n].g];x.fillRect(lx+64,y+4,40,40);x.fillStyle="#000";x.font=`bold 28px ${KR}`;x.fillText(n,lx+120,y+32);
    x.fillStyle="#5a5a5a";x.font=`20px ${KR}`;x.textAlign="right";x.fillText(String(GENRE[n].y),lx+cw,y+30);x.textAlign="left";
    x.fillStyle="#eee";x.fillRect(lx,y+52,cw,2);y+=58;});
  for(let i=RK.length;i<N;i++){x.fillStyle="#bbb";x.font=`16px ${PX}`;x.textAlign="right";x.fillText(String(i+1),lx+44,y+30);x.textAlign="left";x.font=`24px ${KR}`;x.fillStyle="#bbb";x.fillText("빈 자리",lx+120,y+32);x.fillStyle="#eee";x.fillRect(lx,y+52,cw,2);y+=58;}
  // taste
  y+=20;x.fillStyle="#eef0f8";const tl=(()=>{x.font=`24px ${KR}`;return wrap(x,o.taste,cw-60)})();x.fillRect(lx,y,cw,tl.length*36+28);x.fillStyle="#000080";x.fillRect(lx,y,8,tl.length*36+28);
  x.fillStyle="#000";x.font=`24px ${KR}`;tl.forEach((ln,i)=>x.fillText(ln,lx+30,y+40+i*36));y+=tl.length*36+28;
  // footer
  x.fillStyle="#5a5a5a";x.font=`20px ${KR}`;x.textAlign="right";x.fillText("나도 만들기 → "+location.host+location.pathname,lx+cw,py+ph-28);x.textAlign="left";
  return c.toDataURL("image/png");
}
async function showImage(o){
  toast("이미지 만드는 중…");
  const d=await makeImage(o);
  const w=document.createElement("div");w.className="ov";
  w.innerHTML=`<div class="window rw"><div class="tbar"><span class="ico"></span><span class="t">TOP10.png - 그림판</span><span class="x" id="ic">✕</span></div><div style="padding:8px 10px;overflow:auto"><img src="${d}" alt="내 인생게임 TOP10 결과" style="width:100%;display:block;border:1px solid #000"><p class="hint" style="margin:8px 0 0">폰에서는 이미지를 길게 눌러 저장하거나, 아래 버튼을 누르세요.</p></div><div class="foot"><a class="btn" id="dl" href="${d}" download="내_인생게임_TOP10.png" style="text-align:center;text-decoration:none">저장</a><button class="btn pri" id="ish">공유</button><button class="btn" id="ic2">닫기</button></div></div>`;
  document.body.appendChild(w);const close=()=>w.remove();
  w.querySelector("#ic").onclick=w.querySelector("#ic2").onclick=close;w.onclick=e=>{if(e.target===w)close();};
  w.querySelector("#ish").onclick=async()=>{try{const b=await (await fetch(d)).blob();const f=new File([b],"top10.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"나의 인생게임 TOP10",text:o.text});return;}
    if(navigator.share){await navigator.share({title:"나의 인생게임 TOP10",text:o.text});return;}}catch(e){}
    copy(o.text);};
}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("복사됨. 단톡방에 붙여 넣으세요.")}catch(e){toast("복사가 막혔습니다. 길게 눌러 직접 복사해 주세요.")}}
let tt=null;
function toast(m,act){const t=document.getElementById("toast");t.innerHTML="";t.append(m);if(act){const b=document.createElement("button");b.textContent=act[0];b.onclick=()=>{act[1]();};t.append(b);}t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),act?4000:2000);}
topbtn.onclick=openRank;
document.getElementById("restart").onclick=()=>{if(confirm("처음 화면으로 갈까요? TOP10은 그대로 남습니다."))intro();};

  if(r){const rk=r.split(".").map(i=>ALL[+i]).filter(Boolean).slice(0,N);const b=parseInt(q.get("b"));if(rk.length){result(rk,(b>=1950&&b<=2020)?b:null,true);return;}}
