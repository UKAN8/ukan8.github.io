*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Paperlogy','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--text);background:var(--bg);line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word}

.chip{padding:6px 14px;border-radius:99px;font-size:.84rem;font-weight:600;background:var(--card2);border:1px solid var(--border);color:var(--sub)}

.tag{font-size:.72rem;padding:2px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--border);white-space:nowrap}
.empty{color:var(--dim);padding:40px 0;text-align:center}

const R=[

 {who:'s',kind:'one',t:'유강',from:'태성고 1학년',q:'수학 하나는 끝까지 책임져 주는 학원'},

 {who:'s',kind:'hit',t:'유강',from:'용인고 1학년',q:'거의 대부분 봤던 문제였다. 시험 적중률이 너무 좋았다. 7번, 서술형 1·3번 등등'},
 {who:'s',kind:'hit',t:'유강',from:'태성고 1학년',big:1,q:'모든 문제가 기출테스트에서 공부했던 문제들이었다'},

 {who:'s',kind:'change',t:'유강',from:'태성고 1학년',q:'1학기 기말을 망하고 불안했는데, 취약 유형 문제를 많이 만들어 주셔서 점수가 잘 나온 것 같다'},
 {who:'s',kind:'change',t:'유강',from:'고림고 2학년',q:'이제 어려운 문제도 도전해 볼 수 있다'},
 {who:'s',kind:'change',t:'유강',from:'용인고 1학년',q:'모르는 문제가 나와도 포기하지 않고 도전할 용기가 생겼다'},
 {who:'s',kind:'change',t:'유강',from:'용인고 1학년',q:'문제 풀 때 안 쫄아요'},

 {who:'p',kind:'rec',t:'유강',from:'고1 학부모',big:1,q:'대치동 갈 필요 없어요. 대치 방식으로 관리해주시고 학교 분석도 잘해주십니다. 혼자 공부하던 아이가 샘의 터치로 놀라운 점수를 받았네요'},
 {who:'p',kind:'rec',t:'유강',from:'삼계고 1학년 학부모',q:'배울 기회가 주어진다면 정말 좋은 기회. 그만큼 믿고 추천드리고 싶은 선생님'},
 {who:'p',kind:'change',t:'유강',from:'고림고 1학년 학부모',q:'틀린 문제를 풀 수 있을 때까지 반복시키고, 부족하면 계속 등원시켜 공부하게 만든다. 가장 좋아하는 과목이 수학이라고 자신 있게 말한다'},
 {who:'p',kind:'rec',t:'유강',from:'태성고 1학년 학부모',q:'메타인지가 되도록 가르쳐주는 선생님. 자기주도학습이 되는 것 같다'},
 {who:'p',kind:'rec',t:'유강',from:'태성고 1학년 학부모',q:'열정이 크고 학생 관리·피드백 시스템이 잘 갖춰진 학원'},
 {who:'p',kind:'rec',t:'유강',from:'태성고 1학년 학부모',q:'선생님과 학원 시스템이 아주 전문적이다'},
 {who:'p',kind:'change',t:'유강',from:'태성고 1학년 학부모',q:'부족한 부분을 채워주는, 고쳐주는 부분이 대만족'},

 {who:'p',kind:'change',t:'유강',from:'고1 학부모',big:1,q:'가장 어려워했던 과목이 이제 가장 좋아하는 과목. 답을 찾는 과정을 즐긴다'},
 {who:'p',kind:'change',t:'유강',from:'고1 학부모',q:'어려운 문제를 만나면 쉽게 포기했는데, 요즘은 끝까지 해결하려 한다'},
 {who:'p',kind:'rec',t:'유강',from:'고1 학부모',q:'아이가 다 할 때까지! 될 때까지 끌고 가는 곳'},
 {who:'p',kind:'rec',t:'유강',from:'고1 학부모',q:'쌤 열정의 반만 따라가도 최고가 될 수 있는 곳'},
 {who:'p',kind:'change',t:'유강',from:'고1 학부모',q:'반에서 꼴찌 탈출하던 아이가 최근 제법 상위권. 쉬는 날도 없이 노력하는 선생님 리스펙'},
 {who:'p',kind:'rec',t:'유강',from:'고1 학부모',big:1,q:'선생님의 열정과 개별 아이에 대한 정확한 진단으로 질 높은 수업'},
 {who:'p',kind:'rec',t:'유강',from:'고1 학부모',q:'학교별 모의고사로 수준을 알 수 있고, 매 수업 알림톡으로 수업이 한눈에 보인다'},
];
const WHO={s:'학생',p:'학부모'}, KIND={one:'한 문장으로',hit:'시험에서',change:'달라진 점',rec:'추천'};
const F={who:'all',kind:'all',t:'all'};
function chips(id,key,map){
  const g=document.getElementById(id);
  const vals=['all',...Object.keys(map)];
  vals.forEach(v=>{const b=document.createElement('button');b.className='chip'+(v==='all'?' on':'');b.textContent=v==='all'?'전체':map[v];
    b.onclick=()=>{F[key]=v;g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render();};g.appendChild(b);});
}
chips('g-who','who',WHO); chips('g-kind','kind',KIND);
const TS={}; R.forEach(r=>TS[r.t]=r.t+' 선생님 반');
if(Object.keys(TS).length>1) chips('g-t','t',TS); else document.getElementById('g-t').remove();
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){
  const L=R.filter(r=>(F.who==='all'||r.who===F.who)&&(F.kind==='all'||r.kind===F.kind)&&(F.t==='all'||r.t===F.t));
  document.getElementById('grid').innerHTML=L.length?L.map(r=>`<div class="card ${r.who}${r.big?' big':''}"><q>“${esc(r.q)}”</q><div class="who"><b>${esc(r.from)}${r.who==='s'?' 학생':''}</b><span class="tag">${KIND[r.kind]}</span></div></div>`).join(''):'<div class="empty">해당하는 후기가 없습니다.</div>';
}
render();
