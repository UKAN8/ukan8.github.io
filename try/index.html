<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>수업 체험 — 수학은유강</title>
<meta name="description" content="필탑학원 고등수학과 수업을 직접 겪어 보세요. 리뷰테스트 → 유형 열림 → 루프 과제 → 졸업. 새로운 학습 방법을 5분 만에.">
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="수업 체험 — 이런 공부법, 처음일걸">
<meta property="og:description" content="공통수학1 첫 단원으로 리뷰테스트부터 루프 과제, 졸업까지 5분 체험. 필탑학원 고등수학과.">
<meta property="og:url" content="https://ukan8.github.io/try/">
<meta property="og:image" content="https://ukan8.github.io/try/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{
  --bg:#0a0a0f; --card:rgba(255,255,255,.03); --card2:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.09); --line:rgba(255,255,255,.06);
  --text:#f5f5fa; --sub:#b8b8c5; --dim:#8a8a98;
  --accent:#f5a0a0; --accent-bg:rgba(245,160,160,.12);
  --good:#7fd8a8; --good-bg:rgba(127,216,168,.11);
  --mid:#fce8c8; --warm:#f8c48c; --warm-bg:rgba(248,196,140,.1); --lock:#55555f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Paperlogy','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
nav{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-weight:700;font-size:1rem}.logo span{color:var(--accent)}
.day{font-size:.82rem;font-weight:600;color:var(--dim);display:flex;gap:10px;align-items:center}
.day b{color:var(--mid);font-weight:700}
.prog{height:2px;background:var(--line)}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s}

main{padding:28px 0 80px}
.kicker{font-size:.74rem;font-weight:600;letter-spacing:.14em;color:var(--accent);margin-bottom:10px}
h1{font-size:1.9rem;font-weight:800;line-height:1.3;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:800;line-height:1.35;letter-spacing:-.01em}
.lead{color:var(--sub);margin-top:14px;font-size:.98rem}
.muted{color:var(--dim);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.stack>*+*{margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:14px;background:var(--accent);color:#1a0f10;font-weight:700;font-size:1rem;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.rules{display:grid;gap:10px;margin-top:22px}
.rule{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--border)}
.rule .n{font-weight:900;color:var(--accent);font-size:.95rem;min-width:22px}
.rule b{display:block;font-weight:700}
.rule span{color:var(--sub);font-size:.88rem}

.concept{border-left:3px solid var(--accent);background:var(--accent-bg);border-radius:0 14px 14px 0;padding:16px 18px}
.concept h3{font-size:1rem;font-weight:700;margin-bottom:8px}
.concept .f{margin:8px 0;font-size:1.02rem;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.concept p{color:var(--sub);font-size:.88rem}

/* 문항 */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--dim);font-weight:600;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:700}
.tag.c{background:var(--good-bg);color:var(--good)}
.tag.t{background:var(--accent-bg);color:var(--accent)}
.prompt{font-size:1.05rem;line-height:1.9;margin:6px 0 16px;overflow-x:auto;overflow-y:hidden}
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ch{min-height:50px;border-radius:12px;background:var(--card2);border:1px solid var(--border);font-weight:700;font-size:1rem;transition:.15s}
.ch.sel{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.ch.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.ch.wrong{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);text-decoration:line-through}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.cf{min-height:48px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-weight:700;color:var(--sub)}
.cf.sel.sure{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.cf.sel.unsure{border-color:var(--warm);color:var(--warm);background:var(--warm-bg)}
.cfl{font-size:.78rem;color:var(--dim);margin-top:14px;text-align:center}
.verdict{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:.92rem;animation:pop .3s ease}
.verdict b{display:block;font-size:1rem;margin-bottom:2px}
.verdict.ok{background:var(--good-bg);color:var(--good)}
.verdict.half{background:var(--warm-bg);color:var(--warm)}
.verdict.no{background:var(--accent-bg);color:var(--accent)}
.verdict span{color:var(--sub)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 단원 지도 */
.map{display:grid;gap:8px}
.node{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);transition:.4s}
.node .k{font-size:.7rem;font-weight:700;min-width:30px;color:var(--dim)}
.node .nm{flex:1;font-weight:600;font-size:.92rem}
.node .st{font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.node.lock{opacity:.5}.node.lock .st{background:rgba(255,255,255,.05);color:var(--lock)}
.node.open .st{background:rgba(252,232,200,.1);color:var(--mid)}
.node.once .st{background:var(--warm-bg);color:var(--warm)}
.node.grad{border-color:rgba(127,216,168,.35);background:var(--good-bg)}.node.grad .st{background:var(--good);color:#0b1f15}
.node.flash{animation:flash 1s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(245,160,160,.6)}100%{box-shadow:0 0 0 12px rgba(245,160,160,0)}}
.dots{display:flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.12)}.dots i.on{background:var(--warm)}.node.grad .dots i{background:var(--good)}

.unlock{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--accent-bg);color:var(--accent);font-weight:700;font-size:.92rem;animation:pop .35s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:14px 10px;border-radius:12px;background:var(--card);border:1px solid var(--border);text-align:center}
.stat b{display:block;font-size:1.6rem;font-weight:900;line-height:1.2}
.stat span{font-size:.74rem;color:var(--dim)}
.cta{display:grid;gap:10px}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:.78rem;color:var(--dim)}
.hide{display:none!important}
.fade{animation:pop .35s ease}
@media(max-width:380px){.choices{grid-template-columns:repeat(3,1fr)}h1{font-size:1.65rem}}
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="logo" href="/">수학은<span>유강</span></a>
    <div class="day" id="dayBox"><span id="stageName">수업 체험</span><b id="dayLbl"></b></div>
  </div>
  <div class="prog"><i id="prog"></i></div>
</nav>
<main class="wrap" id="app"></main>

<script>
/* ───────── 문항 생성 ─────────
   개념 A·B, 유형 T1(A)·T2(B)·T3(A). 매번 숫자가 바뀌어 외워서 넘어갈 수 없다. */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function choicesOf(ans,ds){
  const set=[ans];
  for(const d of ds){ if(!set.includes(d)) set.push(d); if(set.length===5) break; }
  let k=1; while(set.length<5){ for(const d of [ans+k,ans-k]) if(!set.includes(d)&&set.length<5) set.push(d); k++; }
  return set.sort((a,b)=>a-b);
}
const ITEMS={
  A:{kind:'c',name:'곱셈 공식의 변형 ① — 제곱의 합',short:'제곱의 합',
     card:`<h3>개념 · 제곱의 합</h3>
       <div class="f">\\(a^2+b^2=(a+b)^2-2ab\\)</div>
       <div class="f">\\(a^2+b^2=(a-b)^2+2ab\\)</div>
       <div class="f">\\(x^2+\\dfrac{1}{x^2}=\\left(x+\\dfrac{1}{x}\\right)^2-2\\)</div>
       <p>합과 곱을 알면, 두 수를 몰라도 제곱의 합이 나옵니다.</p>`,
     gen(){const v=R(0,2);
       if(v===0){const s=R(3,6),p=R(1,4);return{q:`\\(a+b=${s},\\ ab=${p}\\) 일 때, \\(a^2+b^2\\) 의 값은?`,ans:s*s-2*p,ds:[s*s+2*p,s*s,s*s-p,s*s-4*p]};}
       if(v===1){const d=R(2,5),p=R(1,5);return{q:`\\(a-b=${d},\\ ab=${p}\\) 일 때, \\(a^2+b^2\\) 의 값은?`,ans:d*d+2*p,ds:[d*d-2*p,d*d,d*d+p,d*d+4*p]};}
       const k=R(3,6);return{q:`\\(x+\\dfrac{1}{x}=${k}\\) 일 때, \\(x^2+\\dfrac{1}{x^2}\\) 의 값은?`,ans:k*k-2,ds:[k*k,k*k+2,k*k-1,2*k]};}},
  B:{kind:'c',name:'곱셈 공식의 변형 ② — 세제곱의 합',short:'세제곱의 합',
     card:`<h3>개념 · 세제곱의 합</h3>
       <div class="f">\\(a^3+b^3=(a+b)^3-3ab(a+b)\\)</div>
       <div class="f">\\(x^3+\\dfrac{1}{x^3}=\\left(x+\\dfrac{1}{x}\\right)^3-3\\left(x+\\dfrac{1}{x}\\right)\\)</div>
       <p>세제곱의 합도 결국 합과 곱만 있으면 됩니다.</p>`,
     gen(){const v=R(0,1);
       if(v===0){const s=R(2,4);let p=pick([-2,-1,1,2,3]);return{q:`\\(a+b=${s},\\ ab=${p}\\) 일 때, \\(a^3+b^3\\) 의 값은?`,ans:s**3-3*p*s,ds:[s**3+3*p*s,s**3-p*s,s**3,s**3-3*p]};}
       const k=R(2,5);return{q:`\\(x+\\dfrac{1}{x}=${k}\\) 일 때, \\(x^3+\\dfrac{1}{x^3}\\) 의 값은?`,ans:k**3-3*k,ds:[k**3,k**3+3*k,k**3-k,k**3-3]};}},
  T1:{kind:'t',need:'A',name:'이차식 = 0 에서 x + 1/x 만들기',short:'x + 1/x 만들기',
     card:`<h3>유형 · 양변을 \\(x\\) 로 나누기</h3>
       <div class="f">\\(x^2-kx+1=0\\ \\Rightarrow\\ x-k+\\dfrac{1}{x}=0\\)</div>
       <div class="f">\\(\\Rightarrow\\ x+\\dfrac{1}{x}=k\\)</div>
       <p>\\(x\\neq0\\) 이므로 양변을 \\(x\\) 로 나눌 수 있습니다. 그다음은 개념 ① 그대로.</p>`,
     gen(){const k=R(3,7);return{q:`\\(x^2-${k}x+1=0\\) 일 때, \\(x^2+\\dfrac{1}{x^2}\\) 의 값은?`,ans:k*k-2,ds:[k*k,k*k+2,k*k-4,k]};}},
  T2:{kind:'t',need:'B',name:'합과 제곱의 합으로 세제곱의 합',short:'세제곱의 합 응용',
     card:`<h3>유형 · 곱을 먼저 구하기</h3>
       <div class="f">\\(ab=\\dfrac{(a+b)^2-(a^2+b^2)}{2}\\)</div>
       <div class="f">\\(a^3+b^3=(a+b)^3-3ab(a+b)\\)</div>
       <p>곱이 안 주어지면, 제곱의 합 공식을 거꾸로 써서 곱부터 만듭니다.</p>`,
     gen(){const s=R(2,4),p=pick([-2,-1,1,2]),q=s*s-2*p,ans=s**3-3*p*s;
       return{q:`\\(a+b=${s},\\ a^2+b^2=${q}\\) 일 때, \\(a^3+b^3\\) 의 값은?`,ans,ds:[s*q,s**3,s**3+3*p*s,s*(q+p)]};}},
  T3:{kind:'t',need:'A',name:'x − 1/x 의 값으로 제곱의 합',short:'x − 1/x 로 제곱의 합',
     card:`<h3>유형 · 차를 알 때</h3>
       <div class="f">\\(x^2+\\dfrac{1}{x^2}=\\left(x-\\dfrac{1}{x}\\right)^2+2\\)</div>
       <p>\\(\\left(x-\\dfrac{1}{x}\\right)^2=x^2-2+\\dfrac{1}{x^2}\\) 이므로 이번엔 2를 더합니다.</p>`,
     gen(){const k=R(1,5);return{q:`\\(x-\\dfrac{1}{x}=${k}\\) 일 때, \\(x^2+\\dfrac{1}{x^2}\\) 의 값은?`,ans:k*k+2,ds:[k*k-2,k*k,k*k+4,2*k+2]};}},
};
const ORDER=['A','B','T1','T2','T3'];

/* ───────── 상태 ───────── */
const S={day:0,st:{},last:{},seen:0,succ:0,unsureRight:0,wrong:0,step:0};
function reset(){S.day=0;S.seen=0;S.succ=0;S.unsureRight=0;S.wrong=0;
  ORDER.forEach(id=>{S.st[id]=ITEMS[id].kind==='c'?0:-1;S.last[id]=null;});} // -1 잠김 0 열림 1 1회 2 졸업
const LBL={'-1':'잠김','0':'열림','1':'1회','2':'졸업'};
const CLS={'-1':'lock','0':'open','1':'once','2':'grad'};

const app=document.getElementById('app');
function tex(el){ if(!window.katex) return setTimeout(()=>tex(el),120);
  // \( \) 수동 렌더
  const walk=n=>{ if(n.nodeType===3){ const s=n.nodeValue; if(!s.includes('\\(')) return;
      const frag=document.createDocumentFragment(); let i=0;
      s.replace(/\\\((.+?)\\\)/g,(m,t,off)=>{ frag.appendChild(document.createTextNode(s.slice(i,off)));
        const sp=document.createElement('span'); try{katex.render(t,sp,{throwOnError:false,displayMode:false});}catch(e){sp.textContent=t;}
        frag.appendChild(sp); i=off+m.length; });
      frag.appendChild(document.createTextNode(s.slice(i))); n.replaceWith(frag);
    } else if(n.nodeType===1 && !n.classList.contains('katex')) [...n.childNodes].forEach(walk); };
  walk(el);
}
function view(html,stage,prog){
  app.innerHTML=`<div class="fade">${html}</div>`;
  document.getElementById('stageName').textContent=stage;
  document.getElementById('dayLbl').textContent=S.day===0?'D+0 · 수업한 날':`D+${S.day}`;
  document.getElementById('prog').style.width=(prog||0)+'%';
  tex(app); window.scrollTo({top:0,behavior:'smooth'});
}
function mapHTML(flash=[]){
  return `<div class="map">${ORDER.map(id=>{const it=ITEMS[id],v=S.st[id];
    const dots=`<span class="dots"><i class="${v>=1?'on':''}"></i><i class="${v>=2?'on':''}"></i></span>`;
    return `<div class="node ${CLS[v]} ${flash.includes(id)?'flash':''}"><span class="k">${it.kind==='c'?'개념':'유형'}</span><span class="nm">${it.short}</span>${dots}<span class="st">${v===-1?'🔒 ':''}${LBL[v]}</span></div>`;}).join('')}</div>`;
}

/* ───────── 화면 1: 시작 ───────── */
function intro(){
  reset();
  view(`
  <div class="kicker">필탑학원 고등수학과 · 수업 체험</div>
  <h1>이런 공부법,<br>처음일걸.</h1>
  <p class="lead">고1 첫 단원 <b>곱셈 공식의 변형</b>으로, 실제 수업에서 도는 흐름을 그대로 겪어 봅니다. 약 5분.</p>
  <div class="rules">
    <div class="rule"><span class="n">1</span><div><b>개념이 서야 유형이 열립니다</b><span>리뷰테스트에서 개념을 통과해야 그 개념의 유형이 열려요.</span></div></div>
    <div class="rule"><span class="n">2</span><div><b>정답 + "확실해요" 만 성공</b><span>맞혀도 "애매해요"면 성공으로 세지 않아요.</span></div></div>
    <div class="rule"><span class="n">3</span><div><b>사흘 간격으로 두 번 = 졸업</b><span>다시 틀리면 처음부터. 숫자는 매번 바뀝니다.</span></div></div>
  </div>
  <div style="margin-top:26px" class="stack">
    <button class="btn" onclick="lesson()">수업부터 듣기</button>
    <p class="muted" style="text-align:center">풀이는 종이에, 답만 고르세요. 실제 리뷰테스트도 그렇게 봅니다.</p>
  </div>`,'수업 체험',2);
}

/* ───────── 화면 2: 개념 수업(요약) ───────── */
function lesson(){
  view(`
  <div class="kicker">D+0 · 개념 수업</div>
  <h2>오늘 배운 개념 두 개.</h2>
  <p class="lead">실제 수업에선 교재 펼친 두 쪽에 개념 하나를 넉넉하게 배웁니다. 여기선 핵심만.</p>
  <div class="stack" style="margin-top:20px">
    <div class="concept">${ITEMS.A.card}</div>
    <div class="concept">${ITEMS.B.card}</div>
  </div>
  <div style="margin-top:22px" class="stack">
    <div class="card"><div class="qhead"><span>단원 지도 · 지금 상태</span></div>${mapHTML()}<p class="muted" style="margin-top:12px">유형 세 개는 아직 잠겨 있어요. 다음 수업 리뷰테스트에서 개념을 통과해야 열립니다.</p></div>
    <button class="btn" onclick="startReview()">다음 수업 · 리뷰테스트 시작</button>
  </div>`,'개념 수업',8);
}

/* ───────── 문항 풀이 공통 ───────── */
let Q=null;
function ask(queue,idx,ctx){
  const id=queue[idx]; const it=ITEMS[id]; const g=it.gen();
  Q={id,g,choices:choicesOf(g.ans,g.ds),pick:null,conf:null,done:false,queue,idx,ctx};
  const total=queue.length;
  view(`
  <div class="kicker">${ctx.title}</div>
  <div class="card">
    <div class="qhead"><span class="tag ${it.kind}">${it.kind==='c'?'개념':'유형'} · ${it.short}</span><span>${idx+1} / ${total}</span></div>
    <div class="prompt">${g.q}</div>
    <div class="choices">${Q.choices.map((c,i)=>`<button class="ch" data-i="${i}" onclick="choose(${i})">${c}</button>`).join('')}</div>
    <p class="cfl">답을 고른 다음, 얼마나 확실한지 고르세요</p>
    <div class="conf">
      <button class="cf sure" onclick="conf('sure')">확실해요</button>
      <button class="cf unsure" onclick="conf('unsure')">애매해요</button>
    </div>
    <div id="vd"></div>
  </div>
  <div style="margin-top:14px"><button class="btn" id="go" disabled onclick="submit()">제출</button></div>
  `,ctx.stage,ctx.prog(idx,total));
}
function choose(i){ if(Q.done) return; Q.pick=i; app.querySelectorAll('.ch').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i)); ready(); }
function conf(c){ if(Q.done) return; Q.conf=c; app.querySelectorAll('.cf').forEach(b=>b.classList.toggle('sel',b.classList.contains(c))); ready(); }
function ready(){ document.getElementById('go').disabled=!(Q.pick!==null&&Q.conf); }
function submit(){
  if(Q.done){ return Q.ctx.next(); }
  Q.done=true; S.seen++;
  const right=Q.choices[Q.pick]===Q.g.ans, sure=Q.conf==='sure', ok=right&&sure;
  app.querySelectorAll('.ch').forEach(b=>{const v=Q.choices[+b.dataset.i]; if(v===Q.g.ans) b.classList.add('right'); else if(+b.dataset.i===Q.pick) b.classList.add('wrong'); b.classList.remove('sel');});
  let html;
  if(ok){ S.succ++; html=`<div class="verdict ok"><b>성공</b><span>정답 + 확실. 오늘 날짜로 한 번 기록됩니다.</span></div>`; }
  else if(right){ S.unsureRight++; html=`<div class="verdict half"><b>맞혔지만, 성공은 아니에요</b><span>"애매해요"로 맞힌 건 찍은 것과 구분이 안 돼요. 개념을 다시 보고, 다음 루프에 또 나옵니다.</span></div><div class="concept" style="margin-top:12px">${ITEMS[Q.id].card}</div>`; }
  else { S.wrong++; html=`<div class="verdict no"><b>정답은 ${Q.g.ans}</b><span>${sure?'확실했는데 틀렸다면, 개념을 잘못 알고 있는지부터 봐야 해요.':'괜찮아요. 개념 정리부터 다시.'} 이 문항은 다음 루프에 다시 나옵니다.</span></div><div class="concept" style="margin-top:12px">${ITEMS[Q.id].card}</div>`; }
  const vd=document.getElementById('vd'); vd.innerHTML=html; tex(vd);
  Q.ctx.record(Q.id,ok);
  const go=document.getElementById('go'); go.textContent=Q.idx+1<Q.queue.length?'다음 문항':'결과 보기';
  setTimeout(()=>vd.scrollIntoView({behavior:'smooth',block:'nearest'}),60);
}

/* ───────── 화면 3: 리뷰테스트 ───────── */
let RV={};
function startReview(){
  S.day=2; RV={res:{},types:[]};
  const queue=['A','A','B','B'];
  const ctx={title:'리뷰테스트 · 개념 4문항',stage:'리뷰테스트',prog:(i,n)=>12+i*4,
    record(id,ok){ (RV.res[id]=RV.res[id]||[]).push(ok); },
    next(){ if(Q.idx+1<queue.length) ask(queue,Q.idx+1,ctx); else afterConcepts(); } };
  ask(queue,0,ctx);
}
function afterConcepts(){
  const passed=[],failed=[],opened=[];
  ['A','B'].forEach(c=>{ const r=RV.res[c]||[]; if(r.length&&r.every(Boolean)){ passed.push(c); S.st[c]=1; S.last[c]=S.day;
      ORDER.filter(t=>ITEMS[t].need===c).forEach(t=>{S.st[t]=0; opened.push(t);}); } else failed.push(c); });
  RV.types=opened;
  const msg = opened.length
    ? `<div class="unlock">🔓 유형 ${opened.length}개가 열렸어요 — ${opened.map(t=>ITEMS[t].short).join(', ')}</div>`
    : `<div class="verdict no"><b>열린 유형이 없어요</b><span>개념을 놓치면 리뷰테스트는 여기서 멈춥니다. 그 개념은 루프 과제로 넘어가요.</span></div>`;
  const fl = failed.length ? `<p class="muted" style="margin-top:10px">놓친 개념 — ${failed.map(c=>ITEMS[c].short).join(', ')}. 두 문항 모두 정답 + 확실이어야 통과예요.</p>`:'';
  view(`
  <div class="kicker">리뷰테스트 · 개념 결과</div>
  <h2>${passed.length===2?'개념 둘 다 통과.':passed.length?'개념 하나 통과.':'개념을 아직 못 세웠어요.'}</h2>
  <div class="stack" style="margin-top:18px">${msg}${fl}
    <div class="card">${mapHTML(opened.concat(passed))}</div>
    <button class="btn" onclick="${opened.length?'reviewTypes()':'toLoop()'}">${opened.length?'열린 유형 풀기':'루프 과제로'}</button>
  </div>`,'리뷰테스트',30);
}
function reviewTypes(){
  const queue=RV.types.slice();
  const ctx={title:'리뷰테스트 · 열린 유형',stage:'리뷰테스트',prog:(i,n)=>30+i*5,
    record(id,ok){ if(ok){S.st[id]=1;S.last[id]=S.day;} },
    next(){ if(Q.idx+1<queue.length) ask(queue,Q.idx+1,ctx); else toLoop(); } };
  ask(queue,0,ctx);
}

/* ───────── 화면 4: 루프 과제 ───────── */
function remaining(){ return ORDER.filter(id=>S.st[id]!==2); }
function toLoop(){
  const left=remaining();
  if(!left.length) return finish();
  const due=left.filter(id=>S.st[id]>=0);
  view(`
  <div class="kicker">D+${S.day} · 오늘 기록</div>
  <h2>${S.day===2?'리뷰테스트 끝.':'오늘 루프 끝.'} 단원 지도가 이렇게 바뀌었어요.</h2>
  <div class="stack" style="margin-top:18px">
    <div class="card">${mapHTML()}</div>
    <div class="rule"><span class="n">↻</span><div><b>졸업까지 ${left.length}개 남았어요</b><span>${due.length}개는 사흘 뒤 루프 과제에 나오고${left.length>due.length?`, 잠긴 ${left.length-due.length}개는 개념이 1회가 되면 열려요`:''}. 숫자는 새로 바뀝니다.</span></div></div>
    <button class="btn" onclick="loop()">사흘 뒤 · 루프 과제 시작</button>
    ${S.day>=11?'<button class="btn ghost" onclick="finish()">그만하고 결과 보기</button>':''}
  </div>`,'루프 과제',Math.min(40+S.day*4,92));
}
function loop(){
  S.day+=3;
  const queue=remaining().filter(id=>S.st[id]>=0);
  const before={...S.st};
  const ctx={title:`루프 과제 · 다시 볼 때가 된 것만`,stage:'루프 과제',prog:(i,n)=>Math.min(40+S.day*4,92),
    record(id,ok){
      if(ok){ S.st[id]=Math.min(2,S.st[id]+1); S.last[id]=S.day;
        if(ITEMS[id].kind==='c'&&S.st[id]>=1) ORDER.filter(t=>ITEMS[t].need===id&&S.st[t]===-1).forEach(t=>S.st[t]=0);
      } else { S.st[id]=0; } },
    next(){ if(Q.idx+1<queue.length) ask(queue,Q.idx+1,ctx); else loopDone(before); } };
  ask(queue,0,ctx);
}
function loopDone(before){
  const grads=ORDER.filter(id=>before[id]!==2&&S.st[id]===2);
  const opens=ORDER.filter(id=>before[id]===-1&&S.st[id]===0);
  const resets=ORDER.filter(id=>before[id]===1&&S.st[id]===0);
  if(!remaining().length) return finish();
  let note='';
  if(grads.length) note+=`<div class="verdict ok"><b>🎓 졸업 ${grads.length}개</b><span>${grads.map(i=>ITEMS[i].short).join(', ')} — 이제 안 나옵니다.</span></div>`;
  if(opens.length) note+=`<div class="unlock">🔓 유형이 열렸어요 — ${opens.map(i=>ITEMS[i].short).join(', ')}</div>`;
  if(resets.length) note+=`<div class="verdict half"><b>처음부터 다시</b><span>${resets.map(i=>ITEMS[i].short).join(', ')} — 1회였지만 이번에 놓쳐서 다시 셉니다.</span></div>`;
  view(`
  <div class="kicker">D+${S.day} · 루프 과제 결과</div>
  <h2>단원 지도가 이렇게 바뀌었어요.</h2>
  <div class="stack" style="margin-top:18px">${note}
    <div class="card">${mapHTML(grads.concat(opens))}</div>
    <button class="btn" onclick="toLoopNext()">다음으로</button>
  </div>`,'루프 과제',Math.min(40+S.day*4,92));
}
function toLoopNext(){ toLoop(); }

/* ───────── 화면 5: 끝 ───────── */
function finish(){
  const all=!remaining().length;
  view(`
  <div class="kicker">D+${S.day} · ${all?'단원 졸업':'체험 종료'}</div>
  <h1>${all?'모르는 개념 · 유형,<br>0개.':'아직 남은 게 있어요.'}</h1>
  <p class="lead">${all?`수업한 날부터 ${S.day}일. 개념 2개와 유형 3개를 모두 <b>사흘 간격으로 두 번, 확실하게</b> 맞혔어요. 실제 수업에선 이게 단원마다, 수업마다 돕니다.`:'실제 수업이었다면 남은 개념·유형은 졸업할 때까지 계속 루프 과제에 나옵니다. 시험 범위가 끝날 때 0개가 되는 게 목표예요.'}</p>
  <div class="stats" style="margin-top:22px">
    <div class="stat"><b>${S.seen}</b><span>푼 문항</span></div>
    <div class="stat"><b style="color:var(--good)">${S.succ}</b><span>성공</span></div>
    <div class="stat"><b style="color:var(--warm)">${S.unsureRight}</b><span>맞혔지만 애매</span></div>
  </div>
  <div class="card" style="margin-top:14px">${mapHTML()}</div>
  <div class="card" style="margin-top:14px">
    <div class="qhead"><span>실제 수업에선 여기에 더해집니다</span></div>
    <div class="stack" style="font-size:.92rem;color:var(--sub)">
      <div>· <b style="color:var(--text)">과제 해결 기록</b> — 문항마다 어떻게 풀었는지. "해설 봐도 모름"은 조교 손풀이로.</div>
      <div>· <b style="color:var(--text)">예약제 주간고사</b> — 확실히 · 헷갈림 · 찍음 · 못 풂이 오답 루프를 정해요.</div>
      <div>· <b style="color:var(--text)">기출테스트 · 퍼스널트레이닝</b> — 시험 3~4주 전, 유형마다 다른 처방.</div>
    </div>
  </div>
  <div class="cta" style="margin-top:22px">
    <button class="btn" onclick="intro()">처음부터 다시 (숫자가 바뀝니다)</button>
    <a class="btn ghost" href="/guide/">학부모님 안내 보기</a>
  </div>
  <div class="foot">필탑학원 고등수학과 · 상담 010-6456-8959<br>체험 문항은 공통수학1 「다항식의 연산」 범위입니다.</div>
  `,all?'졸업':'체험 종료',100);
}
intro();
</script>
<script data-goatcounter="https://ukan8.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
