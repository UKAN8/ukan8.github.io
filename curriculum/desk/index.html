<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예비고1 일정 · 데스크</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0f">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<style>
:root{--bg:#0a0a0f;--card:rgba(255,255,255,.03);--border:rgba(255,255,255,.09);--line:rgba(255,255,255,.07);--text:#f5f5fa;--sub:#b8b8c5;--dim:#8a8a98;--accent:#f5a0a0;--mid:#fce8c8;--good:#c8f0da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Paperlogy','Pretendard','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;word-break:keep-all}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,15,.95);border-bottom:1px solid var(--line);padding:14px 20px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:18px;font-weight:800}h1 span{color:var(--accent)}
.today{color:var(--sub);font-size:13px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.bar button{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer}
.bar button.on{background:rgba(245,160,160,.14);border-color:rgba(245,160,160,.45);color:var(--accent)}
.bar .sp{flex:1}
.bar i{font-style:normal;color:var(--dim);font-size:12px;margin:0 4px 0 8px}
main{padding:16px 20px 60px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sum div{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border)}
.sum b{font-size:15px}.sum small{color:var(--dim);margin-left:6px}.sum p{color:var(--sub);font-size:12.5px;margin-top:2px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{position:sticky;top:0;background:#14141b;font-size:12px;color:var(--dim);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--text)}th .ar{color:var(--accent);margin-left:4px;font-size:10px}
td.d{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
td.w{color:var(--dim);white-space:nowrap;font-size:12px}
td .t{color:var(--dim);font-size:12px;margin-right:6px;font-variant-numeric:tabular-nums}
td .no{display:inline-block;min-width:34px;color:var(--mid);font-weight:700;font-variant-numeric:tabular-nums}
td.off{color:var(--dim)}td.off b{color:#ff8fa8;font-weight:700}
td.x{color:rgba(255,255,255,.18)}
tr.wk td{border-top:2px solid rgba(255,255,255,.14)}
tr.ex td.memo{color:var(--accent);font-weight:700}
tr.today td{background:rgba(245,160,160,.12)}
td.memo{color:var(--sub);font-size:12.5px}
.foot{color:var(--dim);font-size:12px;margin-top:12px}
@media print{
  :root{--bg:#fff;--text:#111;--sub:#333;--dim:#777;--line:#ddd;--border:#ccc;--card:#fff;--mid:#a05a00;--accent:#c0392b}
  header{position:static;background:#fff}.bar{display:none}thead th{background:#f3f3f3;color:#333}
  tr.today td{background:none}.tw{border:none}body{font-size:11px}
}
</style>
</head>
<body>
<header>
  <div class="top"><h1>예비고1 정규 시즌 <span>데스크</span></h1><span class="today" id="today"></span></div>
  <div class="bar" id="bar"></div>
</header>
<main>
  <div class="sum" id="sum"></div>
  <div class="tw"><table id="tb"><thead><tr id="hd"></tr></thead><tbody id="bd"></tbody></table></div>
  <p class="foot">휴강 회차는 13주차(2/22~2/27) 진도 보강에서 채웁니다 · 윈터특강(공통수학2, 1/11~2/27)은 요일 확정 후 추가 · 인쇄하면 밝은 표로 나옵니다</p>
</main>
<script src="../data.js"></script>
<script>
(function(){
  const C=window.CUR, todayIso=C.iso(new Date());
  document.getElementById('today').textContent='오늘 '+C.label(new Date());
  const S={}; C.CLASSES.forEach(c=>{S[c.id]={};C.sessions(c).forEach(x=>S[c.id][x.iso]=x);});
  // 수업 있는 날만 행으로
  const rows=C.days().filter(d=>C.CLASSES.some(c=>S[c.id][C.iso(d)])).map(d=>{const k=C.iso(d),w=C.weekOf(d);return {d,k,w};});
  // 요약
  document.getElementById('sum').innerHTML=C.CLASSES.map(c=>{const ss=Object.values(S[c.id]),on=ss.filter(x=>!x.off).length,off=ss.length-on;
    const days=Object.keys(c.slots).map(n=>'일월화수목금토'[n]).join('·');
    return '<div><b>'+c.name+'</b><small>'+c.level+' · '+c.teacher+'</small><p>'+days+' · 수업 '+on+'회 · 휴강 '+off+'회</p></div>';}).join('');
  // 필터
  const F={m:'all'}; const months=[['all','전체'],['wk','이번 주'],['12','12월'],['1','1월'],['2','2월']];
  const bar=document.getElementById('bar');
  months.forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;b.dataset.v=v;b.onclick=()=>{F.m=v;draw();};bar.appendChild(b);});
  bar.insertAdjacentHTML('beforeend','<span class="sp"></span>');
  const tb=document.createElement('button');tb.textContent='오늘로';tb.onclick=()=>{const r=document.querySelector('tr.today')||[...document.querySelectorAll('#bd tr')].find(r=>r.dataset.k>=todayIso);if(r)r.scrollIntoView({block:'center'});};bar.appendChild(tb);
  const pb=document.createElement('button');pb.textContent='인쇄';pb.onclick=()=>print();bar.appendChild(pb);
  // 헤더 + 정렬
  const cols=['날짜','주차'].concat(C.CLASSES.map(c=>c.name)).concat(['단원 · 메모']);
  const hd=document.getElementById('hd'); hd.innerHTML=cols.map(c=>'<th>'+c+'</th>').join('');
  let sortCol=-1,dir=0;
  hd.querySelectorAll('th').forEach((th,i)=>th.onclick=()=>{dir=sortCol===i?(dir+1)%3:1;sortCol=i;draw();});
  function weekRange(){const t=new Date();const m=new Date(t);m.setDate(t.getDate()-((t.getDay()+6)%7));const e=new Date(m);e.setDate(m.getDate()+6);return [C.iso(m),C.iso(e)];}
  function cell(c,k){const x=S[c.id][k];if(!x)return '<td class="x">·</td>';
    if(x.off)return '<td class="off"><span class="t">'+x.time+'</span><b>휴강</b> '+x.off+'</td>';
    return '<td><span class="t">'+x.time+'</span><span class="no">'+x.no+'회</span></td>';}
  function draw(){
    bar.querySelectorAll('button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===F.m));
    let L=rows.filter(r=>{if(F.m==='all')return true;if(F.m==='wk'){const [a,b]=weekRange();return r.k>=a&&r.k<=b;}return String(r.d.getMonth()+1)===F.m;});
    if(dir&&sortCol>=0){const keyOf=r=>{if(sortCol===0)return r.k;if(sortCol===1)return r.w[0];const ci=sortCol-2;if(ci<C.CLASSES.length){const x=S[C.CLASSES[ci].id][r.k];return x?(x.off?-1:x.no):-2;}return r.w[2];};
      L=[...L].sort((a,b)=>{const x=keyOf(a),y=keyOf(b);return (x>y?1:x<y?-1:0)*(dir===1?1:-1);});}
    hd.querySelectorAll('th').forEach((th,i)=>{th.innerHTML=cols[i]+(i===sortCol&&dir?'<span class="ar">'+(dir===1?'▲':'▼')+'</span>':'');});
    let lastW=0;
    document.getElementById('bd').innerHTML=L.map(r=>{const wk=!dir&&r.w[0]!==lastW;lastW=r.w[0];const ex=/고사/.test(r.w[3]);
      return '<tr data-k="'+r.k+'" class="'+(wk?'wk ':'')+(ex?'ex ':'')+(r.k===todayIso?'today':'')+'"><td class="d">'+C.label(r.d)+'</td><td class="w">'+r.w[0]+'주차</td>'+C.CLASSES.map(c=>cell(c,r.k)).join('')+'<td class="memo">'+r.w[2]+(r.w[3]&&r.w[3]!=='개강'?' · '+r.w[3]:'')+'</td></tr>';}).join('')||'<tr><td colspan="'+cols.length+'" class="memo">해당 기간 수업 없음</td></tr>';
  }
  draw();
})();
</script>
</body>
</html>
